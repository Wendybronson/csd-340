<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSD 340 Web Development with HTML and CSS</title>

    <link rel="stylesheet" href="Bronson_Mod11_2.css">
</head>

<body>

    <div class="container">

        <h1>Assignment 11.2: JavaScript - Part 3</h1>

        <div class="input-box">

            <p>
                Enter a task below and click Add to add it to the list.
                Click Delete Last Entry to remove the last task entered.
                Click Sort to place the tasks in alphabetical order.
            </p>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <div class="button-group">

                <button
                    class="add-button"
                    onclick="addTask()">
                    Add
                </button>

                <button
                    class="delete-button"
                    onclick="deleteTask()">
                    Delete Last Entry
                </button>

                <button
                    class="sort-button"
                    onclick="sortTasks()">
                    Sort
                </button>

            </div>

        </div>

        <div class="display-box">

            <h2>Things To Do</h2>

            <div id="taskDisplay">
                No tasks have been added yet.
            </div>

        </div>

    </div>


    <script>

        // Array used to store the user's tasks
        let taskList = [];


        // Adds a task to the array
        function addTask() {

            let task =
                document.getElementById("taskInput").value;

            if (task !== "") {

                taskList.push(task);

                alert(
                    "Item: " + task +
                    " Added as Item " +
                    taskList.length
                );

                document.getElementById("taskInput").value = "";

                displayTasks();

            } else {

                alert("Please enter a task.");

            }
        }


        // Deletes the last entry in the array
        function deleteTask() {

            if (taskList.length > 0) {

                let deletedItem = taskList.pop();

                alert(
                    "Deleted Item: " + deletedItem
                );

                displayTasks();

            } else {

                alert("There are no tasks to delete.");

            }
        }


        // Sorts the array alphabetically
        function sortTasks() {

            if (taskList.length > 0) {

                taskList.sort();

                alert("The task list has been sorted.");

                displayTasks();

            } else {

                alert("There are no tasks to sort.");

            }
        }


        // Displays all items stored in the array
        function displayTasks() {

            let output = "";

            for (let i = 0; i < taskList.length; i++) {

                output +=
                    "Item " +
                    (i + 1) +
                    ": " +
                    taskList[i] +
                    "<br>";
            }

            if (taskList.length === 0) {

                output =
                    "No tasks have been added yet.";
            }

            document.getElementById(
                "taskDisplay"
            ).innerHTML = output;
        }

    </script>

</body>

</html>
